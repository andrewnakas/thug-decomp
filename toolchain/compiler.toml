# The pinned compiler pipeline. Every tool (configure.py, match.py, gate.py,
# permute.py) reads this file; nothing hard-codes flags.
# Changing anything here is a tooling change: it re-judges every function.

[compiler]
# Pinned 2026-11-03 by the identification sweep (docs/COMPILER_ID.md): only SN 1.36 saves
# $ra with sd (older SN builds use sq); -ffast-math gives the inline sqrt.s of func_00100118.
# SN Systems ProDG builds of ee-gcc; the ELF's .DVP.overlay sections are SN dvp-as output.
name = "ee-gcc2.95.3-136"
cflags = ["-O2", "-G8", "-ffast-math", "-fno-exceptions", "-fopt-stack"]   # no EH frames in the ELF; -fopt-stack: sd $s0 in 0x10 frames
cppflags = ["-Iinclude", "-Iinclude/game", "-DTHUG_DECOMP"]

[as]
# GNU as for splat's asm (never for compiler output: SN's own as.exe assembles that).
flags = ["-EL", "-march=r5900", "-mabi=o64", "-mno-pdr", "-no-pad-sections", "-G0", "-Iinclude"]

# Per-file flag overrides: a unit may start with  /* cflags: -O1 */  and only
# flags listed here are accepted (tools/scan.py enforces it).
[per_file]
allowed_cflags = ["-O0", "-O1", "-O2", "-O3", "-G0", "-G4", "-G8",
                  "-fno-schedule-insns", "-fno-schedule-insns2", "-fno-strength-reduce",
                  "-fno-inline", "-funsigned-char", "-fsigned-char", "-fopt-stack",
                  "-fno-rerun-loop-opt", "-fno-gcse", "-mno-split-addresses"]

# Known compilers: decompme/compilers "compilers" release assets, verified by sha256.
# dir is relative to toolchain/compilers/, driver relative to dir.
[compilers."ee-gcc2.95.3-136"]
url = "https://github.com/decompme/compilers/releases/download/compilers/ee-gcc2.95.3-136.tar.gz"
sha256 = "3b6ae6897229ad005aaf1b0afaa1f3cb46e74b4c21a42e01130c07c0c598067f"
dir = "ee-gcc2.95.3-136"
driver = "bin/ee-gcc.exe"

